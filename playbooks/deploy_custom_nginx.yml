---
- name: Deploy Custom Website using Docker
  hosts: docker_servers
  become: true
  gather_facts: false

  vars:
    app_name: custom-nginx-site
    app_version: v1
    docker_image: "{{ app_name }}:{{ app_version }}"
    host_port: 8082
    container_port: 80
    remote_app_path: /opt/custom-nginx-site

  tasks:

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ remote_app_path }}"
        state: directory
        mode: '0755'

    - name: Copy website and Dockerfile to Docker server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../projects/nginx-custom-site/files/"
        dest: "{{ remote_app_path }}/"
        mode: '0644'

    - name: Build custom Docker image
      community.docker.docker_image:
        name: "{{ app_name }}"
        tag: "{{ app_version }}"
        source: build
        build:
          path: "{{ remote_app_path }}"
          pull: true
        force_source: true

    - name: Deploy custom Nginx container
      community.docker.docker_container:
        name: "{{ app_name }}"
        image: "{{ docker_image }}"
        state: started
        recreate: true
        restart_policy: unless-stopped
        published_ports:
          - "{{ host_port }}:{{ container_port }}"

    - name: Wait for website to become available
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ host_port }}"
        method: GET
        status_code: 200
        return_content: true
      register: website_response
      retries: 10
      delay: 3
      until: website_response.status == 200

    - name: Display deployment result
      ansible.builtin.debug:
        msg: "Custom website deployed successfully at port {{ host_port }}"
