---
- name: Check Linux server uptime
  hosts: all
  gather_facts: false

  tasks:
    - name: Collect server information
      ansible.builtin.shell: |
        echo "Hostname: $(hostname)"
        echo "IP Address: $(hostname -I | awk '{print $1}')"
        echo "Uptime: $(uptime -p)"
        echo "Last Boot: $(uptime -s)"
      args:
        executable: /bin/bash
      register: server_status
      changed_when: false

    - name: Display server uptime
      ansible.builtin.debug:
        msg: "{{ server_status.stdout_lines }}"