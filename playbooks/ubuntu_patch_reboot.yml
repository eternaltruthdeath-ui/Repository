---
- name: Ubuntu Server Patch and Reboot
  hosts: ubuntu
  become: true
  gather_facts: true

  tasks:

    - name: Verify that the target is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: "This playbook is intended for Ubuntu servers only."

    - name: Display target server information
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: patch_result

    - name: Check whether reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display patch and reboot status
      ansible.builtin.debug:
        msg:
          - "Packages changed: {{ patch_result.changed }}"
          - "Reboot required: {{ reboot_required.stat.exists }}"

    - name: Reboot Ubuntu server when required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after Ubuntu patching"
        connect_timeout: 10
        reboot_timeout: 900
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: whoami
      when: reboot_required.stat.exists

    - name: Verify server is reachable after patching
      ansible.builtin.ping:

    - name: Display final server status
      ansible.builtin.debug:
        msg:
          - "Server: {{ inventory_hostname }}"
          - "Patching completed successfully"
          - "Current kernel: {{ ansible_kernel }}"
