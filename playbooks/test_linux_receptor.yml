---
- name: AWX Receptor Linux SSH Connectivity Test
  hosts: all
  gather_facts: true

  tasks:
    - name: Display Linux target information
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_hostname }}"
          - "Inventory name: {{ inventory_hostname }}"
          - "Operating system: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "IP address: {{ ansible_default_ipv4.address | default('Not detected') }}"

    - name: Verify target connectivity
      ansible.builtin.ping:

    - name: Verify remote command execution
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Display successful execution
      ansible.builtin.debug:
        msg: "SUCCESS: Executed on {{ hostname_result.stdout }} through the AWX Receptor execution node."
