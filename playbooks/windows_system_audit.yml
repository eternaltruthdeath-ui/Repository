---
- name: Windows System Audit - Read Only
  hosts: windows
  gather_facts: false

  tasks:

    - name: Get computer information
      ansible.windows.win_shell: |
        Get-CimInstance Win32_ComputerSystem |
        Select-Object Name, Domain, Manufacturer, Model |
        Format-List
      register: computer_info
      changed_when: false

    - name: Display computer information
      ansible.builtin.debug:
        var: computer_info.stdout_lines

    - name: Get Windows operating system
      ansible.windows.win_shell: |
        Get-CimInstance Win32_OperatingSystem |
        Select-Object Caption, Version, BuildNumber,
        OSArchitecture, LastBootUpTime |
        Format-List
      register: os_info
      changed_when: false

    - name: Display operating system
      ansible.builtin.debug:
        var: os_info.stdout_lines

    - name: Get CPU information
      ansible.windows.win_shell: |
        Get-CimInstance Win32_Processor |
        Select-Object Name, NumberOfCores,
        NumberOfLogicalProcessors |
        Format-List
      register: cpu_info
      changed_when: false

    - name: Display CPU information
      ansible.builtin.debug:
        var: cpu_info.stdout_lines

    - name: Get memory information
      ansible.windows.win_shell: |
        $memory = Get-CimInstance Win32_ComputerSystem
        [PSCustomObject]@{
          TotalRAM_GB = [math]::Round(
            $memory.TotalPhysicalMemory / 1GB, 2
          )
        } | Format-List
      register: memory_info
      changed_when: false

    - name: Display memory information
      ansible.builtin.debug:
        var: memory_info.stdout_lines

    - name: Get fixed disk information
      ansible.windows.win_shell: |
        Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
        Select-Object DeviceID,
          @{Name='SizeGB';Expression={[math]::Round($_.Size/1GB,2)}},
          @{Name='FreeGB';Expression={[math]::Round($_.FreeSpace/1GB,2)}} |
        Format-Table -AutoSize
      register: disk_info
      changed_when: false

    - name: Display disk information
      ansible.builtin.debug:
        var: disk_info.stdout_lines

    - name: Get system uptime
      ansible.windows.win_shell: |
        $os = Get-CimInstance Win32_OperatingSystem
        $uptime = (Get-Date) - $os.LastBootUpTime
        "Uptime: $($uptime.Days) days, $($uptime.Hours) hours, $($uptime.Minutes) minutes"
      register: uptime_info
      changed_when: false

    - name: Display uptime
      ansible.builtin.debug:
        var: uptime_info.stdout_lines

    - name: Windows audit completed
      ansible.builtin.debug:
        msg: "Windows system audit completed."
